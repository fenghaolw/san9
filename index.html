<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>三国志9 × P社大战略：中原逐鹿 (M1 垂直切片可玩版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.0.0",
          "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
          "three": "https://esm.sh/three@0.172.0"
        }
      }
    </script>
    <style>
      * {
        user-select: none;
        box-sizing: border-box;
      }
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #0b0f19;
        color: #e2e8f0;
        font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Serif SC", sans-serif;
      }
      /* 古风暗金滚动条 */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(15, 23, 42, 0.7);
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(217, 119, 6, 0.55);
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(245, 158, 11, 0.85);
      }
      @keyframes pulseGlow {
        0%, 100% { transform: scale(1); box-shadow: 0 0 18px rgba(245, 158, 11, 0.55); }
        50% { transform: scale(1.03); box-shadow: 0 0 32px rgba(239, 68, 68, 0.85); }
      }
      .cutin-banner {
        animation: pulseGlow 1.2s infinite ease-in-out;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
