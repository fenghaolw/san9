<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>San9 x Paradox 规范驱动单元测试运行器 (SPEC-00 ~ SPEC-05)</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-950 text-slate-100 p-8 font-sans">
    <div class="max-w-4xl mx-auto space-y-4">
      <div class="flex items-center justify-between border-b border-amber-500/40 pb-4">
        <div>
          <h1 class="text-2xl font-black text-amber-300">🧪 《三国志9 × P社大战略》SDD 规范验证测试套件</h1>
          <p class="text-sm text-slate-400">验证 SPEC-00 至 SPEC-05 核心公式、寻路、联动、四阶人口、控制度与 40-Tick 旬推演</p>
        </div>
        <a href="../index.html" class="px-4 py-2 rounded bg-amber-600 hover:bg-amber-500 text-white font-bold text-sm">
          ▶ 返回游戏主沙盘
        </a>
      </div>
      <div id="summary" class="p-4 rounded-lg bg-slate-900 border border-slate-800 font-mono text-sm">正在运行测试...</div>
      <div id="results" class="space-y-2"></div>
    </div>

    <script type="module">
      import { runAllSpecTests } from './core.spec.js';

      const results = runAllSpecTests();
      const passed = results.filter((r) => r.passed).length;
      const summaryEl = document.getElementById('summary');
      const listEl = document.getElementById('results');

      summaryEl.innerHTML = `测试总数: <b>${results.length}</b> | 通过: <b class="text-emerald-400">${passed}</b> | 失败: <b class="${
        passed === results.length ? 'text-slate-500' : 'text-red-400'
      }">${results.length - passed}</b>`;

      listEl.innerHTML = results
        .map(
          (r) => `
          <div class="p-3 rounded border ${
            r.passed ? 'bg-emerald-950/30 border-emerald-500/40' : 'bg-red-950/40 border-red-500'
          }">
            <div class="font-bold ${r.passed ? 'text-emerald-300' : 'text-red-300'}">
              ${r.passed ? '✅ PASS' : '❌ FAIL'} — ${r.name}
            </div>
            <div class="text-xs font-mono text-slate-400 mt-1">${r.detail}</div>
          </div>
        `
        )
        .join('');
    </script>
  </body>
</html>
